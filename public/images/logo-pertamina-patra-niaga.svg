    <text x="1" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#DA251D" letter-spacing="1.2">PATRA NIAGA</text>
